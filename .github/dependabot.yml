version: 2

updates:
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    labels:
      - dependencies
    allow:
      - dependency-type: all
    automerged_updates:
      - match:
          update_type: "version-update:semver-patch"
          dependency_type: "development"
        when: "ci-passed"

  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - github-actions
    allow:
      - dependency-type: all
    automerged_updates:
      - match:
          update_type: "version-update:semver-patch"
        when: "ci-passed"
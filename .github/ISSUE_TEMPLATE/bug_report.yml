name: Bug report
description: Something in agent-loop-guard-js is not working as documented
title: "[Bug]: "
labels: ["bug", "needs triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug.

        **Security issues are handled privately** — please use
        [private vulnerability reporting](https://github.com/OMD-123/agent-loop-guard/security/advisories/new)
        instead of this form.

  - type: input
    id: version
    attributes:
      label: Version
      description: The version of `agent-loop-guard-js` you are using.
      placeholder: 4.0.0
    validations:
      required: true

  - type: dropdown
    id: runtime
    attributes:
      label: Runtime
      options:
        - Node.js
        - Bun
        - Deno
        - Browser / edge
        - Other
    validations:
      required: true

  - type: input
    id: node-version
    attributes:
      label: Node version
      placeholder: v22.0.0
    validations:
      required: false

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you observe? Include the actual output.
      placeholder: The loop checker did not block a repeated call with reordered arguments.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: A small snippet that reproduces the problem.
      render: typescript
    validations:
      required: true

  - type: textarea
    id: checkers
    attributes:
      label: Which checkers are involved?
      description: e.g. LoopChecker, SecurityChecker, ToolPolicyChecker, or "custom".
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched the existing issues and this is not a duplicate.
          required: true
        - label: I read the migration guide and this is not a v3 → v4 migration issue.
          required: false

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to release'
        required: true

permissions:
  contents: read

jobs:
  release:
    name: Publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify
        run: npm run verify

      - name: Build
        run: npm run build

      - name: Check the published type layout
        run: npm run attw

      - name: Publish to npm
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          # Required for npm provenance generation.
          NPM_CONFIG_PROVENANCE: true
          ID_TOKEN_PERMISSIONS: write

      - name: Create the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            ## What's in this release

            See [CHANGELOG.md](https://github.com/OMD-123/agent-loop-guard/blob/main/CHANGELOG.md)
            for the full details.

            ### Install

            ```bash
            npm install agent-loop-guard-js
            ```

            Upgrading from v3? Read the
            [migration guide](https://github.com/OMD-123/agent-loop-guard/blob/main/MIGRATION.md).

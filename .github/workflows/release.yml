name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to release'
        required: true

permissions:
  contents: read

jobs:
  release:
    name: Publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Required for npm provenance (OIDC).
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify
        run: npm run verify

      - name: Build
        run: npm run build

      - name: Check the published type layout
        run: npm run attw

      - name: Resolve the version and check whether it is already published
        id: version
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          if npm view "agent-loop-guard-js@$VERSION" version > /dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "::notice::v$VERSION is already on npm — skipping the publish step."
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm
        # Skipped when the version is already on the registry, so re-running a
        # tag push does not fail the workflow.
        if: steps.version.outputs.published == 'false'
        run: |
          # `NPM_TOKEN` is a publish-scoped automation token. When npm trusted
          # publishing is enabled for this package the token is unnecessary and
          # provenance is generated from the OIDC identity instead.
          npm publish --access public ${NPM_PUBLISH_FLAGS}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          # Provenance is only generated when the runner can obtain an OIDC
          # token *and* npm trusts this workflow. Set NPM_PUBLISH_FLAGS=--provenance
          # once trusted publishing is configured.
          NPM_PUBLISH_FLAGS: ${{ vars.NPM_PUBLISH_FLAGS }}

      - name: Create the GitHub release
        if: steps.version.outputs.published == 'false'
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          body: |
            ## What's in this release

            See [CHANGELOG.md](https://github.com/OMD-123/agent-loop-guard/blob/main/CHANGELOG.md)
            for the full details.

            ### Install

            ```bash
            npm install agent-loop-guard-js
            ```

            Upgrading from v3? Read the
            [migration guide](https://github.com/OMD-123/agent-loop-guard/blob/main/MIGRATION.md).

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Node ${{ matrix.node-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node-version: ['18.x', '20.x', '22.x']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npm run coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage/coverage-final.json
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  package:
    name: Package integrity
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Check the published type layout
        run: npm run attw

      - name: Verify the tarball contents
        run: |
          # `npm pack --json` prints the build script output before the JSON,
          # so the JSON has to be extracted from the tail of the output.
          npm pack --dry-run --json > pack.log 2>&1 || true
          node scripts/check-tarball.mjs pack.log

      - name: Install the tarball into a clean project and import it
        run: |
          npm pack
          mkdir -p /tmp/consumer && cd /tmp/consumer
          npm init -y > /dev/null
          npm install "$GITHUB_WORKSPACE"/agent-loop-guard-js-*.tgz
          node --input-type=module -e "
            import { Guardrail, LoopChecker } from 'agent-loop-guard-js';
            const g = new Guardrail([new LoopChecker({ maxSteps: 1 })]);
            g.start();
            g.check({ type: 'llm_response', content: 'ok', timestamp: Date.now() });
            const d = g.check({ type: 'llm_response', content: 'ok', timestamp: Date.now() });
            if (d.allowed) { console.error('guard did not block'); process.exit(1); }
            console.log('ESM import OK:', d.reason);
          "
          node -e "
            const { Guardrail, LoopChecker } = require('agent-loop-guard-js');
            const g = new Guardrail([new LoopChecker({ maxSteps: 1 })]);
            g.start();
            g.check({ type: 'llm_response', content: 'ok', timestamp: Date.now() });
            const d = g.check({ type: 'llm_response', content: 'ok', timestamp: Date.now() });
            if (d.allowed) { console.error('guard did not block'); process.exit(1); }
            console.log('CJS require OK:', d.reason);
          "
